name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest -q
      - name: install.sh dry run
        if: runner.os != 'Windows'
        run: TTYPLAYER_INSTALL_DRY_RUN=1 sh install.sh
      - name: install.ps1 dry run
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File install.ps1 -DryRun
