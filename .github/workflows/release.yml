name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout of this private repo
      id-token: write  # trusted publishing: PyPI trusts this workflow, no stored secrets
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  homebrew:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Wait for the release on PyPI
        run: |
          # The JSON API is what the generator reads; pip's simple index lags behind it.
          version="${GITHUB_REF_NAME#v}"
          url="https://pypi.org/pypi/ttyplayer/$version/json"
          # Attempts start 20 s apart against a 20-minute deadline, so slow requests cannot stretch either.
          start=$(date +%s)
          deadline=$((start + 1200))
          minute=0
          while attempt=$(date +%s); [ "$attempt" -lt "$deadline" ]; do
            left=$((deadline - attempt))
            curl -fsS --max-time $((left < 10 ? left : 10)) -o /dev/null "$url" 2>/dev/null && exit 0
            now=$(date +%s)
            if [ $(((now - start) / 60)) -gt "$minute" ]; then
              minute=$(((now - start) / 60))
              echo "Waiting for ttyplayer $version on PyPI ($minute min)"
            fi
            next=$((attempt + 20 < deadline ? attempt + 20 : deadline))
            if [ "$now" -lt "$next" ]; then sleep $((next - now)); fi
          done
          echo "ttyplayer $version did not appear on PyPI within 20 minutes" >&2
          exit 1
      - name: Generate the formula
        run: |
          mkdir -p Formula
          python3 -I scripts/brew_formula.py "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/ttyplayer.rb"
          mv "$RUNNER_TEMP/ttyplayer.rb" Formula/ttyplayer.rb
      - name: Commit the formula to webliftro/homebrew-tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone -q "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/webliftro/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp Formula/ttyplayer.rb "$RUNNER_TEMP/tap/Formula/ttyplayer.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/ttyplayer.rb
          if git diff --cached --quiet; then echo "The tap already has ttyplayer $version"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "ttyplayer $version"
          git push -q origin HEAD:main
      - name: Upload the formula
        if: env.HOMEBREW_TAP_TOKEN == ''
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: Formula/ttyplayer.rb
      - name: Explain the tap setup
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "::notice::No HOMEBREW_TAP_TOKEN secret, so the formula was uploaded as the homebrew-formula artifact instead of committed to the tap."
          echo "To publish it on every release:"
          echo "1. Create the empty public repository webliftro/homebrew-tap."
          echo "2. Create a fine-grained token with Contents: read and write on that repository only, and add it to webliftro/ttyplayer as the Actions secret HOMEBREW_TAP_TOKEN."
